function renderExam(){screen='exam';if(remaining()<=0){finish(true);return}clearInterval(tick);const item=BANK[state.index];let sec=SECTIONS.find(s=>s.key===item.section),items=sectionQuestions(item.section),localNo=items.findIndex(q=>q.id===item.id)+1;const done=answeredCount();const vals=['Sangat tidak sesuai','Tidak sesuai','Netral','Sesuai','Sangat sesuai'];app.innerHTML=`<header class="exam-head"><div><b>SIMULASI CAT ProASN</b><div class="fineprint">NIP: ${esc(state.nip||state.name)} • Administrator Eselon III</div></div><div class="flex"><div><div class="fineprint">Sisa waktu total</div><div id="clock" class="timer">${formatTime(remaining())}</div></div><button class="btn red hideprint" id="end">Akhiri</button></div></header><div class="wrap"><div class="exam-layout"><section class="card"><div class="flex between"><span class="pill">${esc(sec.label)}</span><span class="muted">Soal ${localNo} dari ${items.length}</span></div><div class="progressline"><div class="progressbar" style="width:${100*done/531}%"></div></div><div class="fineprint" style="margin-top:7px">Terjawab ${done}/531 • Belum terjawab ${531-done}</div><div class="qtitle">${esc(item.q)}</div>${item.section==='Karier'?`<p class="muted">Seberapa sesuai pernyataan ini dengan diri Anda? Jawab sesuai kondisi sebenarnya.</p><div class="careerlikert">${vals.map((x,i)=>`<label><input type="radio" name="answer" value="${i+1}" ${state.answers[item.id]===i+1?'checked':''}><span>${i+1}</span><div>${esc(x)}</div></label>`).join('')}</div>`:`<div>${item.options.map((x,i)=>`<label class="option ${state.answers[item.id]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${state.answers[item.id]===i?'checked':''}><div><span class="choice-label">${'ABCD'[i]}.</span>${esc(x)}</div></label>`).join('')}</div>`}<div class="btnrow hideprint"><div class="toolbar"><button class="btn secondary" id="prev" ${state.index===0?'disabled':''}>← Sebelumnya</button><button class="btn" id="next">${state.index===530?'Ke soal pertama':'Selanjutnya →'}</button></div><button class="btn outline" id="flag">${state.flags[item.id]?'★ Hapus tanda':'☆ Tandai soal'}</button></div></section><aside class="side"><section class="card"><h2>Navigasi soal</h2><div class="fineprint">Klik nomor untuk berpindah. Hijau = dijawab, garis oranye = ditandai.</div><div id="tabs">${SECTIONS.map(x=>`<button class="section-tab ${x.key===item.section?'active':''}" data-section="${x.key}">${x.key==='Manajerial'?'Manajerial':x.key==='Digital'?'Digital':x.key}</button>`).join('')}</div><div class="navgrid">${items.map((x,i)=>`<button data-id="${x.id}" class="${answered(x)?'done':''} ${state.flags[x.id]?'marked':''} ${x.id===item.id?'current':''}" title="Soal ${i+1}">${i+1}</button>`).join('')}</div><hr style="border:0;border-top:1px solid #dce8f0;margin:19px 0"><div class="flex between"><span>Sudah dijawab</span><b>${done}</b></div><div class="flex between"><span>Belum dijawab</span><b>${531-done}</b></div><button class="btn outline full spaced hideprint" id="confirmend">Selesai & lihat hasil</button></section></aside></div></div>`;
 document.querySelectorAll('input[name=answer]').forEach(el=>el.addEventListener('change',()=>{state.answers[item.id]=Number(el.value);save();renderExam()}));document.getElementById('prev').onclick=()=>{state.index--;save();renderExam()};document.getElementById('next').onclick=()=>{state.index=(state.index+1)%531;save();renderExam()};document.getElementById('flag').onclick=()=>{state.flags[item.id]=!state.flags[item.id];save();renderExam()};document.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>{state.index=Number(el.dataset.id)-1;save();renderExam()});document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>{state.index=BANK.findIndex(q=>q.section===el.dataset.section);save();renderExam()});document.getElementById('end').onclick=confirmFinish;document.getElementById('confirmend').onclick=confirmFinish;tick=setInterval(()=>{const c=document.getElementById('clock');if(c){c.textContent=formatTime(remaining());c.classList.toggle('warn',remaining()<600)}if(remaining()<=0)finish(true)},1000)}
function confirmFinish(){const not=531-answeredCount();if(confirm(`Akhiri simulasi sekarang? Masih ada ${not} butir yang belum dijawab. Jawaban kosong dinilai salah pada tes kemampuan. Preferensi karier yang kosong tidak dihitung.`))finish(false)}
function finish(timeout){clearInterval(tick);state.finished=true;state.finishedAt=Date.now();state.timeout=timeout;save();renderResult()}
function report(){const obj=BANK.filter(q=>q.section!=='Karier');const by={};for(const q of obj){const k=q.section+' — '+q.sub;by[k]??={correct:0,answered:0,total:0};by[k].total++;if(answered(q)){by[k].answered++;if(state.answers[q.id]===q.key)by[k].correct++}}const cor=Object.values(by).reduce((s,x)=>s+x.correct,0),ans=Object.values(by).reduce((s,x)=>s+x.answered,0),career={};for(const q of BANK.filter(q=>q.section==='Karier')){career[q.sub]??={sum:0,count:0};if(answered(q)){career[q.sub].sum+=state.answers[q.id];career[q.sub].count++}}return {by,cor,ans,total:363,career}}
function renderResult(){screen='result';clearInterval(tick);const r=report(),pct=(100*r.cor/r.total).toFixed(1),miss=531-answeredCount();const careers=Object.entries(r.career).map(([n,v])=>({n,...v,score:v.count?(v.sum/v.count):0})).sort((a,b)=>b.score-a.score);const reviews=BANK.filter(q=>q.section!=='Karier' && answered(q) && state.answers[q.id]!==q.key);app.innerHTML=`<div class="wrap"><div class="hero"><div class="smallcaps">Hasil simulasi • ${esc(state.name)} • Administrator Eselon III</div><h1>Latihan selesai</h1><p>Berikut evaluasi latihan berdasarkan jawaban yang dimasukkan. <b>Bukan nilai resmi BKN, bukan hasil assessment center, dan bukan prediksi kelulusan.</b></p></div><div class="metrics spaced"><div class="metric"><strong>${pct}%</strong><span>Akurasi dari 363 soal kemampuan</span></div><div class="metric"><strong>${r.cor}</strong><span>Jawaban tepat</span></div><div class="metric"><strong>${r.ans}</strong><span>Soal kemampuan terjawab</span></div><div class="metric"><strong>${answeredCount()}/531</strong><span>Seluruh butir dijawab</span></div></div><div class="grid2 spaced"><section class="card"><h2>Performa per kelompok dan subtes</h2>${Object.entries(r.by).map(([name,v])=>`<div style="margin:16px 0"><div class="flex between"><span>${esc(name)}</span><b>${v.correct}/${v.total}</b></div><div class="bar"><div style="width:${100*v.correct/v.total}%"></div></div><div class="fineprint">${v.answered} dijawab • ${(100*v.correct/v.total).toFixed(1)}% tepat dari seluruh butir</div></div>`).join('')}<div class="notice spaced">Skor akurasi dihitung dengan rumus jawaban benar ÷ 363 × 100%. Jawaban kosong dianggap tidak benar. Tidak ada penalti jawaban salah.</div></section><section class="card"><h2>Preferensi karier (deskriptif)</h2><p class="muted">Rata-rata respons diri pada skala 1–5. Bukan nilai lulus/gagal dan bukan skor psikometri tervalidasi.</p>${careers.map(x=>`<div style="margin:16px 0"><div class="flex between"><span>${esc(x.n)}</span><b>${x.count?x.score.toFixed(2):'—'}/5</b></div><div class="bar"><div style="width:${20*x.score}%;background:#5c9c84"></div></div><div class="fineprint">Terisi ${x.count}/28 pernyataan</div></div>`).join('')}<div class="notice danger spaced">${miss?`${miss} butir belum dijawab. Interpretasi preferensi belum lengkap jika ada respons kosong.`:'Seluruh butir telah dijawab.'} Jawablah sesuai diri sendiri; tidak ada profil yang dianggap paling unggul.</div></section></div><section class="card spaced"><h2>Ulasan soal yang belum tepat</h2><p class="muted">Ditampilkan maksimal 40 soal salah yang sudah dijawab. Penjelasan tidak mencerminkan pedoman atau kunci resmi BKN.</p>${reviews.slice(0,40).map(q=>`<details class="review"><summary>${esc(q.section)} · ${esc(q.sub)} — Soal ${q.id}</summary><p>${esc(q.q)}</p><div class="bad">Jawaban Anda: ${esc(q.options[state.answers[q.id]])}</div><div class="good">Kunci latihan: ${esc(q.options[q.key])}</div><p>${esc(q.why)}</p></details>`).join('')||'<p class="good">Tidak ada jawaban salah pada soal yang terjawab.</p>'}<div class="toolbar spaced hideprint"><button class="btn" id="export">Unduh laporan JSON</button><button class="btn secondary" id="print">Cetak / simpan PDF</button><button class="btn outline" id="restart">Mulai simulasi baru</button></div></section></div>`;document.getElementById('print').onclick=()=>window.print();document.getElementById('restart').onclick=()=>{if(confirm('Hapus seluruh jawaban sesi ini dan kembali ke halaman login?')){localStorage.removeItem(STORE);state=null;renderLogin()}};document.getElementById('export').onclick=()=>{const data={type:'Simulasi ProASN Independen',official:false,name:state.name,nip:state.nip||null,jabatan:"Administrator / Eselon III",durationMinutes:180,startedAt:new Date(state.startedAt).toISOString(),finishedAt:new Date(state.finishedAt).toISOString(),...r,answered:answeredCount(),totalQuestions:531};const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='laporan_simulasi_proasn.json';a.click();URL.revokeObjectURL(url)}}
renderLogin();</script></body></html>
